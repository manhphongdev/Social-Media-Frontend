<nav class="app-header">
  <div class="brand">
    <a routerLink="/" class="brand-logo">SocialApp</a>
  </div>

  <div class="actions">
    <a routerLink="/" class="action" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Trang chủ</a>
    <a routerLink="/messages" class="action" routerLinkActive="active">Tin nhắn</a>

    <!-- Notifications with badge -->
    <a routerLink="/notifications" class="action notification-link" routerLinkActive="active"
      (click)="clearNotificationBadge()">
      Thông báo
      <span class="notification-badge" *ngIf="unreadNotificationCount > 0">
        {{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}
      </span>
    </a>

    <div class="auth-buttons">
      <a routerLink="/login" class="action" routerLinkActive="active">Đăng nhập</a>
      <a routerLink="/register" class="btn-primary">Đăng ký</a>
    </div>
  </div>

  <button class="menu-btn" (click)="toggleMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <div class="mobile-menu" *ngIf="menuOpen">
    <a routerLink="/" (click)="toggleMenu()">Trang chủ</a>
    <a routerLink="/messages" (click)="toggleMenu()">Tin nhắn</a>

    <!-- Notifications in mobile menu with badge -->
    <a routerLink="/notifications" (click)="toggleMenu(); clearNotificationBadge()" class="notification-link">
      Thông báo
      <span class="notification-badge" *ngIf="unreadNotificationCount > 0">
        {{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}
      </span>
    </a>

    <hr style="border: 0; border-top: 1px solid var(--border-subtle); margin: 8px 0;">
    <a routerLink="/login" (click)="toggleMenu()">Đăng nhập</a>
    <a routerLink="/register" (click)="toggleMenu()">Đăng ký</a>
  </div>
</nav>
