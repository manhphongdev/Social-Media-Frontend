<div class="auth-page">
  <div class="auth-card">
    <h2>Tạo tài khoản</h2>
    <p class="subtitle">Tham gia cộng đồng của chúng tôi ngay hôm nay!</p>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="submit()" [formGroup]="form">
      <!-- Full width fields -->
      <label class="full-width">
        Họ & Tên
        <input formControlName="name" placeholder="Nguyễn Văn A" type="text"/>
      </label>

      <label class="full-width">
        Email
        <input autocomplete="email" formControlName="email" placeholder="your@email.com" type="email"/>
      </label>

      <!-- Two column layout -->
      <div class="form-row">
        <label>
          Mật khẩu
          <input autocomplete="new-password" formControlName="password" placeholder="••••••••" type="password"/>
        </label>

        <label>
          Xác nhận mật khẩu
          <input autocomplete="new-password" formControlName="confirmPassword" placeholder="••••••••" type="password"/>
        </label>
      </div>

      <div class="form-row">
        <label>
          Ngày sinh
          <input autocomplete="dateOfBirth" formControlName="dateOfBirth" type="date"/>
        </label>

        <label>
          Giới tính
          <select formControlName="gender">
            <option disabled selected value="">Chọn giới tính</option>
            <option value="MALE">Nam</option>
            <option value="FEMALE">Nữ</option>
            <option value="OTHER">Khác</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button [disabled]="form.invalid || loading" type="submit">
          <span *ngIf="loading">Đang xử lý...</span>
          <span *ngIf="!loading">Tạo tài khoản</span>
        </button>
      </div>
    </form>

    <p class="muted">
      Đã có tài khoản?
      <a routerLink="/login">Đăng nhập ngay</a>
    </p>
  </div>
</div>
