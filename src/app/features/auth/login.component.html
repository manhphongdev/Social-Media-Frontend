<div class="auth-page">
  <div class="auth-card">
    <h2>Đăng nhập</h2>
    <p class="subtitle">Chào mừng trở lại! Vui lòng đăng nhập vào tài khoản của bạn.</p>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Email
        <input formControlName="email" type="email" placeholder="your@email.com" autocomplete="email" />
      </label>

      <label>
        Mật khẩu
        <input formControlName="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </label>

      <div class="actions">
        <button type="submit" [disabled]="form.invalid || loading">
          <span *ngIf="loading">Đang xử lý...</span>
          <span *ngIf="!loading">Đăng nhập</span>
        </button>
      </div>
    </form>

    <p class="muted">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký ngay</a>
    </p>
  </div>
</div>
