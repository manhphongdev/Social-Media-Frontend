<div class="auth-page">
  <div class="auth-card">
    <h2>Đăng nhập</h2>
    <p class="subtitle">Chào mừng trở lại! Vui lòng đăng nhập vào tài khoản của bạn.</p>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="submit()" [formGroup]="form">
      <label>
        Username
        <input autocomplete="username" formControlName="username" placeholder="Nhập username" type="text"/>
      </label>

      <label>
        Mật khẩu
        <input autocomplete="current-password" formControlName="password" placeholder="••••••••" type="password"/>
      </label>

      <div class="actions">
        <button [disabled]="form.invalid || loading" type="submit">
          <span *ngIf="loading">Đang xử lý...</span>
          <span *ngIf="!loading">Đăng nhập</span>
        </button>
      </div>
    </form>

    <p class="muted">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký ngay</a>
    </p>
  </div>
</div>
